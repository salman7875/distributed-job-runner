version: "1.1"

services:
  redis-stack:
    image: redis/redis-stack:latest
    container_name: redis-stack-container
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      REDIS_HOST: redis-stack
      REDIS_PORT: 6378

  api:
    container_name: nodejs-api-container
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: npm run dev:server
    depends_on:
      - redis-stack
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    restart: unless-stopped

  worker:
    container_name: nodejs-worker-container
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: npm run dev:worker
    depends_on:
      - redis-stack
    volumes:
      - .:/app
    restart: unless-stopped
