version: "1"

services:
  redis:
    image: redis
    container_name: redis-container
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    container_name: nodejs-api-container
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: npm run dev:server
    depends_on:
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

  worker:
    container_name: nodejs-worker-container
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: npm run dev:worker
    depends_on:
      - redis
    volumes:
      - .:/app
    restart: unless-stopped
