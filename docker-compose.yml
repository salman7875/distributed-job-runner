version: "1"

services:
  redis-stack:
    image: redis/redis-stack:latest
    container_name: redis-stack-container
    restart: unless-stopped
    ports:
      - "6379:6378"
      - "8001:8001"
    depends_on:
      - redis

  api:
    container_name: nodejs-api-container
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: npm run dev:server
    depends_on:
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

  worker:
    container_name: nodejs-worker-container
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: npm run dev:worker
    depends_on:
      - redis
    volumes:
      - .:/app
    restart: unless-stopped
